<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="lia-chron-title lia-chron-desc">
  <title id="lia-chron-title">Published Little Ice Age chronologies against the Maunder Minimum, 1200 to 2000</title>
  <desc id="lia-chron-desc">A single linear time axis from 1200 to 2000. A narrow vertical band marks the Maunder Minimum, 1645 to 1715, the seventy years in which the Sun almost stopped making sunspots. Five horizontal bars show published datings of the Little Ice Age, and none of them begins or ends at that band. Owens and colleagues put the Little Ice Age at roughly 1440 to 1920. Miller and colleagues date an abrupt onset to 1275 to 1300 with intensification from 1430 to 1455 and cold sustained for centuries after. Below, Neukom and colleagues show the coldest epoch arriving at different times in different places: the fifteenth century in the central and eastern Pacific, the seventeenth century in northwestern Europe, and the mid nineteenth century across most of the globe. Only the northwestern Europe bar overlaps the Maunder Minimum band, and that is the single region the textbook story draws its evidence from.</desc>

  <defs>
    <linearGradient id="liaCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <filter id="liaSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <filter id="liaLift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20344f" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="860" height="480" rx="20" fill="url(#liaCard)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#liaSoft)"/>

  <text x="440" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.5">THE ACCUSED, AND THE FIVE CENTURIES IT IS ACCUSED OF</text>
  <text x="440" y="70" text-anchor="middle" font-size="11.5" fill="#5a6880">Every published Little Ice Age chronology, drawn on one linear axis against the Maunder Minimum.</text>

  <!-- Maunder Minimum band: the accused -->
  <rect x="556" y="116" width="56" height="288" rx="4" fill="#c2603f" opacity="0.13"/>
  <text x="584" y="98" text-anchor="middle" font-size="10" font-weight="700" fill="#c2603f" letter-spacing="1.2">MAUNDER MINIMUM</text>
  <text x="584" y="110" text-anchor="middle" font-size="9" font-weight="600" fill="#c2603f">1645 to 1715</text>

  <!-- axis -->
  <text x="200" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1200</text>
  <text x="280" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1300</text>
  <text x="360" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1400</text>
  <text x="440" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1500</text>
  <text x="520" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1600</text>
  <text x="600" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1700</text>
  <text x="680" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1800</text>
  <text x="760" y="136" text-anchor="middle" font-size="9" fill="#8794a8">1900</text>
  <text x="840" y="136" text-anchor="middle" font-size="9" fill="#8794a8">2000</text>
  <line x1="200" y1="144" x2="840" y2="144" stroke="#d5dde8" stroke-width="1"/>

  <!-- GROUP 1 -->
  <text x="20" y="164" font-size="8" font-weight="700" fill="#8794a8" letter-spacing="1.1">HOW LONG WAS THE LITTLE ICE AGE?</text>

  <text x="188" y="188" text-anchor="end" font-size="12" font-weight="700" fill="#12203a">Owens et al. 2017</text>
  <g filter="url(#liaLift)">
    <rect x="392" y="172" width="384" height="24" rx="6" fill="#2f6f9f"/>
  </g>
  <text x="400" y="188" font-size="10.5" font-weight="700" fill="#ffffff">1440 to 1920</text>

  <text x="188" y="228" text-anchor="end" font-size="12" font-weight="700" fill="#12203a">Miller et al. 2012</text>
  <rect x="260" y="212" width="460" height="24" rx="6" fill="#cfdcea"/>
  <g filter="url(#liaLift)">
    <rect x="260" y="212" width="20" height="24" rx="4" fill="#2f6f9f"/>
    <rect x="384" y="212" width="20" height="24" rx="4" fill="#2f6f9f"/>
  </g>
  <text x="288" y="228" font-size="9" font-weight="700" fill="#3f5570">onset 1275 to 1300</text>
  <text x="412" y="228" font-size="9" font-weight="700" fill="#3f5570">intensifies 1430 to 1455, cold then sustained for centuries</text>

  <!-- GROUP 2 -->
  <text x="20" y="268" font-size="8" font-weight="700" fill="#8794a8" letter-spacing="1.1">NEUKOM ET AL. 2019: WHEN THE COLDEST EPOCH ACTUALLY ARRIVED, BY REGION</text>

  <text x="188" y="296" text-anchor="end" font-size="12" font-weight="700" fill="#12203a">Central &amp; E. Pacific</text>
  <g filter="url(#liaLift)">
    <rect x="360" y="280" width="80" height="24" rx="6" fill="#7fa6c6"/>
  </g>
  <text x="368" y="296" font-size="10" font-weight="700" fill="#ffffff">1400s</text>

  <text x="188" y="336" text-anchor="end" font-size="12" font-weight="700" fill="#c2603f">Northwestern Europe</text>
  <g filter="url(#liaLift)">
    <rect x="520" y="320" width="80" height="24" rx="6" fill="#c2603f"/>
  </g>
  <text x="528" y="336" font-size="10" font-weight="700" fill="#ffffff">1600s</text>

  <text x="188" y="376" text-anchor="end" font-size="12" font-weight="700" fill="#12203a">Most of the globe</text>
  <g filter="url(#liaLift)">
    <rect x="704" y="360" width="32" height="24" rx="6" fill="#7fa6c6"/>
  </g>
  <text x="744" y="376" font-size="10" font-weight="700" fill="#3f5570">mid-1800s</text>

  <!-- band edges on top: the sliver crosses everything -->
  <line x1="556" y1="116" x2="556" y2="404" stroke="#c2603f" stroke-width="1" stroke-dasharray="4,3" opacity="0.75"/>
  <line x1="612" y1="116" x2="612" y2="404" stroke="#c2603f" stroke-width="1" stroke-dasharray="4,3" opacity="0.75"/>

  <!-- editorial callout: the one region that does overlap -->
  <text x="624" y="336" font-size="10.5" font-style="italic" fill="#c2603f">the only overlap</text>

  <!-- verdict -->
  <line x1="20" y1="424" x2="860" y2="424" stroke="#e4e9f1" stroke-width="1"/>
  <text x="20" y="446" font-size="10.5" fill="#5a6880">Not one chronology starts or ends at the Maunder Minimum. The single region that does overlap it,</text>
  <text x="20" y="462" font-size="10.5" fill="#5a6880">northwestern Europe, is the one the frozen Thames and the Dutch winter paintings come from.</text>
</svg>
