<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="dcc-title dcc-desc">
  <title id="dcc-title">Where a startup's taxable income ends up, depending on its legal form</title>
  <desc id="dcc-desc">Two side-by-side columns, each a three-layer capital chain: the fund's own investors at the top (a university endowment or pension fund, which is tax-exempt, and a foreign institution), the venture fund in the middle, which is a partnership that passes income through, and the startup at the bottom. In the left column the startup is an LLC: its income passes up through the fund to the investors, so the endowment owes US tax on unrelated business income and the foreign institution has to file a US tax return. In the right column the startup is a C corporation: its income is taxed inside the corporation and stops there, so nothing reaches the fund or its investors until they sell their shares.</desc>

  <defs>
    <linearGradient id="dcc-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="dcc-pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="dcc-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1ec"/><stop offset="1" stop-color="#fbe6dd"/>
    </linearGradient>
    <linearGradient id="dcc-cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fa"/><stop offset="1" stop-color="#e3edf6"/>
    </linearGradient>
    <filter id="dcc-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <filter id="dcc-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#20344f" flood-opacity="0.13"/>
    </filter>
    <marker id="dcc-arr-warm" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#c2603f"/></marker>
    <marker id="dcc-arr-cool" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#2f6f9f"/></marker>
  </defs>

  <rect x="10" y="10" width="860" height="620" rx="20" fill="url(#dcc-card)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#dcc-soft)"/>

  <!-- Column headers -->
  <text x="228" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#c2603f" letter-spacing="1.5">IF THE STARTUP IS AN LLC</text>
  <text x="652" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.5">IF THE STARTUP IS A C CORPORATION</text>
  <line x1="440" y1="36" x2="440" y2="600" stroke="#e1e7ef" stroke-width="1.5"/>

  <!-- ===== LEFT: LLC ===== -->
  <!-- Investors row -->
  <g filter="url(#dcc-lift)"><rect x="48" y="68" width="172" height="112" rx="14" fill="url(#dcc-warm)" stroke="#efcfc2" stroke-width="1.5"/></g>
  <text x="134" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Endowment or</text>
  <text x="134" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">pension fund</text>
  <text x="134" y="140" text-anchor="middle" font-size="11.5" fill="#8a4a33">tax-exempt, but now</text>
  <text x="134" y="156" text-anchor="middle" font-size="11.5" fill="#8a4a33">owes US tax on</text>
  <text x="134" y="172" text-anchor="middle" font-size="11.5" fill="#8a4a33">business income</text>

  <g filter="url(#dcc-lift)"><rect x="236" y="68" width="172" height="112" rx="14" fill="url(#dcc-warm)" stroke="#efcfc2" stroke-width="1.5"/></g>
  <text x="322" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Foreign</text>
  <text x="322" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">institution</text>
  <text x="322" y="140" text-anchor="middle" font-size="11.5" fill="#8a4a33">now has to file</text>
  <text x="322" y="156" text-anchor="middle" font-size="11.5" fill="#8a4a33">a US tax return,</text>
  <text x="322" y="172" text-anchor="middle" font-size="11.5" fill="#8a4a33">with withholding</text>

  <!-- Fund -->
  <g filter="url(#dcc-lift)"><rect x="92" y="272" width="272" height="84" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
  <text x="228" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12203a">Venture fund</text>
  <text x="228" y="330" text-anchor="middle" font-size="11.5" fill="#5a6880">a partnership: passes income through</text>

  <!-- Startup -->
  <g filter="url(#dcc-lift)"><rect x="92" y="456" width="272" height="84" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
  <text x="228" y="490" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12203a">Startup, as an LLC</text>
  <text x="228" y="514" text-anchor="middle" font-size="11.5" fill="#5a6880">a pass-through: its income is not taxed here</text>

  <!-- Upward flow, startup -> fund -> both investors -->
  <path d="M 228 456 L 228 366" fill="none" stroke="#c2603f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#dcc-arr-warm)"/>
  <text x="240" y="416" font-size="11.5" fill="#8a4a33">income passes up</text>
  <path d="M 184 272 L 148 190" fill="none" stroke="#c2603f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#dcc-arr-warm)"/>
  <path d="M 272 272 L 308 190" fill="none" stroke="#c2603f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#dcc-arr-warm)"/>

  <text x="228" y="582" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8a4a33">The tax bill lands on the investors three layers up.</text>

  <!-- ===== RIGHT: C CORP ===== -->
  <g opacity="0.55">
    <g filter="url(#dcc-lift)"><rect x="472" y="68" width="172" height="112" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
    <text x="558" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Endowment or</text>
    <text x="558" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">pension fund</text>
    <text x="558" y="148" text-anchor="middle" font-size="11.5" fill="#5a6880">no US tax filing</text>

    <g filter="url(#dcc-lift)"><rect x="660" y="68" width="172" height="112" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
    <text x="746" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Foreign</text>
    <text x="746" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">institution</text>
    <text x="746" y="148" text-anchor="middle" font-size="11.5" fill="#5a6880">no US tax return</text>

    <g filter="url(#dcc-lift)"><rect x="516" y="272" width="272" height="84" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
    <text x="652" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12203a">Venture fund</text>
    <text x="652" y="330" text-anchor="middle" font-size="11.5" fill="#5a6880">nothing to pass through</text>
  </g>

  <!-- Barrier chip between startup and fund -->
  <g filter="url(#dcc-lift)"><rect x="540" y="384" width="224" height="40" rx="20" fill="url(#dcc-cool)" stroke="#cdddec" stroke-width="1.5"/></g>
  <text x="652" y="409" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6f9f">TAX STOPS HERE</text>

  <g filter="url(#dcc-lift)"><rect x="516" y="456" width="272" height="84" rx="14" fill="url(#dcc-cool)" stroke="#cdddec" stroke-width="1.5"/></g>
  <text x="652" y="490" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12203a">Startup, as a C corporation</text>
  <text x="652" y="514" text-anchor="middle" font-size="11.5" fill="#31405a">a taxpayer in its own right</text>

  <path d="M 652 456 L 652 434" fill="none" stroke="#2f6f9f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#dcc-arr-cool)"/>

  <text x="652" y="582" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2f6f9f">The company pays its own tax. Investors pay when they sell.</text>
</svg>
