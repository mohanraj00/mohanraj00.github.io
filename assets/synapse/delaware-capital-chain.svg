<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="dcc-title dcc-desc">
  <title id="dcc-title">Where a startup's income ends up, depending on its legal form</title>
  <desc id="dcc-desc">Two columns, each the same three-step chain of money: the fund's own investors at the top (pension funds, universities and foreign institutions), the venture fund in the middle, and the startup at the bottom. Left column, the startup is an LLC: arrows carry its income up through the fund to the investors, who now owe US tax or must file US tax returns. Right column, the startup is a C corporation: a label reading tax stops here sits directly on top of the startup, and the fund and investors above it are greyed out with no US tax to deal with.</desc>
  <defs>
    <linearGradient id="dcc-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/></linearGradient>
    <linearGradient id="dcc-pane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <linearGradient id="dcc-warm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf1ec"/><stop offset="1" stop-color="#fbe6dd"/></linearGradient>
    <linearGradient id="dcc-cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4fa"/><stop offset="1" stop-color="#e3edf6"/></linearGradient>
    <filter id="dcc-soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/></filter>
    <filter id="dcc-lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#20344f" flood-opacity="0.12"/></filter>
    <marker id="dcc-arr-warm" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#c2603f"/></marker>
    <marker id="dcc-arr-cool" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#2f6f9f"/></marker>
  </defs>
  <rect x="10" y="10" width="620" height="620" rx="20" fill="url(#dcc-card)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#dcc-soft)"/>

  <text x="170" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#c2603f" letter-spacing="1.4">IF THE STARTUP</text>
  <text x="170" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#c2603f" letter-spacing="1.4">IS AN LLC</text>
  <text x="470" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f9f" letter-spacing="1.4">IF THE STARTUP IS</text>
  <text x="470" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f9f" letter-spacing="1.4">A C CORPORATION</text>
  <line x1="320" y1="40" x2="320" y2="600" stroke="#e1e7ef" stroke-width="1.5"/>

  <!-- LEFT -->
  <g text-anchor="middle" font-size="15">
    <g filter="url(#dcc-lift)"><rect x="40" y="88" width="260" height="120" rx="14" fill="url(#dcc-warm)" stroke="#efcfc2" stroke-width="1.5"/></g>
    <text x="170" y="118" font-size="17" font-weight="700" fill="#12203a">The fund's investors</text>
    <text x="170" y="140" fill="#5a6880">pensions, universities,</text>
    <text x="170" y="160" fill="#5a6880">foreign institutions</text>
    <text x="170" y="190" font-weight="700" fill="#8a4a33">now owe US tax</text>

    <g filter="url(#dcc-lift)"><rect x="40" y="290" width="260" height="84" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
    <text x="170" y="324" font-size="17" font-weight="700" fill="#12203a">Venture fund</text>
    <text x="170" y="348" fill="#5a6880">passes the income on</text>

    <g filter="url(#dcc-lift)"><rect x="40" y="456" width="260" height="84" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
    <text x="170" y="490" font-size="17" font-weight="700" fill="#12203a">Startup (LLC)</text>
    <text x="170" y="514" fill="#5a6880">passes its income up</text>
  </g>
  <path d="M 170 456 L 170 384" stroke="#c2603f" stroke-width="3" stroke-linecap="round" marker-end="url(#dcc-arr-warm)"/>
  <path d="M 170 290 L 170 218" stroke="#c2603f" stroke-width="3" stroke-linecap="round" marker-end="url(#dcc-arr-warm)"/>
  <text x="170" y="584" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4a33">The tax lands at the top.</text>

  <!-- RIGHT -->
  <g text-anchor="middle" font-size="15" opacity="0.55">
    <g filter="url(#dcc-lift)"><rect x="340" y="88" width="260" height="120" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
    <text x="470" y="118" font-size="17" font-weight="700" fill="#12203a">The fund's investors</text>
    <text x="470" y="140" fill="#5a6880">pensions, universities,</text>
    <text x="470" y="160" fill="#5a6880">foreign institutions</text>
    <text x="470" y="190" font-weight="700" fill="#5a6880">no US tax to deal with</text>

    <g filter="url(#dcc-lift)"><rect x="340" y="290" width="260" height="84" rx="14" fill="url(#dcc-pane)" stroke="#dde3ec" stroke-width="1.5"/></g>
    <text x="470" y="324" font-size="17" font-weight="700" fill="#12203a">Venture fund</text>
    <text x="470" y="348" fill="#5a6880">nothing to pass on</text>
  </g>
  <g filter="url(#dcc-lift)"><rect x="370" y="404" width="200" height="40" rx="20" fill="#2f6f9f"/></g>
  <text x="470" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1.2">TAX STOPS HERE</text>
  <g text-anchor="middle" font-size="15">
    <g filter="url(#dcc-lift)"><rect x="340" y="456" width="260" height="84" rx="14" fill="url(#dcc-cool)" stroke="#cdddec" stroke-width="1.5"/></g>
    <text x="470" y="490" font-size="17" font-weight="700" fill="#12203a">Startup (C corp)</text>
    <text x="470" y="514" fill="#31405a">pays its own tax</text>
  </g>
  <text x="470" y="584" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6f9f">The tax stays at the bottom.</text>
</svg>
