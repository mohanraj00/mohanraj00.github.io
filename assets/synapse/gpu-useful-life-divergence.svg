<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The assumed useful life of a server at each of the four largest AI spenders, 2022 to 2026</title>
  <desc id="d">Four rows, one per company, running left to right from 2022 to 2026. Each row is divided into blocks showing how many years that firm assumed a server would keep earning; darker blocks are longer assumed lives. Microsoft: four years, then six years from fiscal 2023. Alphabet: four years, then six years from January 2023. Amazon: five years, then six years from January 2024, then back down to five years for a subset of servers from January 2025, cutting its 2025 net income by one billion dollars. Meta: five years, then five and a half years for most servers from January 2025, raising its 2025 net income by two point five nine billion dollars. A vertical band marks 1 January 2025, where Amazon's row steps down and Meta's row steps up on the same date.</desc>

  <defs>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="noteG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20344f" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="860" height="600" rx="20" fill="url(#cardG)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#soft)"/>

  <text x="440" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.5">HOW LONG DOES A SERVER KEEP EARNING? EACH FIRM'S OWN 10-K ANSWER</text>
  <text x="440" y="64" text-anchor="middle" font-size="11.5" fill="#5a6880">Assumed useful life for depreciation. Darker is a longer assumed life, and so a smaller annual expense.</text>

  <!-- the shared moment -->
  <rect x="575" y="98" width="17" height="300" rx="4" fill="#c2603f" opacity="0.13"/>
  <text x="583" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#c2603f" letter-spacing="1.2">1 JANUARY 2025</text>

  <!-- ── Microsoft ── -->
  <text x="138" y="139" text-anchor="end" font-size="12.5" font-weight="700" fill="#12203a">Microsoft</text>
  <g filter="url(#lift)">
    <rect x="150" y="108" width="70" height="52" rx="8" fill="#cfdcea"/>
    <rect x="224" y="108" width="576" height="52" rx="8" fill="#2f6f9f"/>
  </g>
  <text x="185" y="139" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f5570">4 yrs</text>
  <text x="512" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6 yrs</text>

  <!-- ── Alphabet ── -->
  <text x="138" y="213" text-anchor="end" font-size="12.5" font-weight="700" fill="#12203a">Alphabet</text>
  <g filter="url(#lift)">
    <rect x="150" y="182" width="142" height="52" rx="8" fill="#cfdcea"/>
    <rect x="296" y="182" width="504" height="52" rx="8" fill="#2f6f9f"/>
  </g>
  <text x="221" y="213" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3f5570">4 yrs</text>
  <text x="548" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6 yrs</text>

  <!-- ── Amazon: up, then back down ── -->
  <text x="138" y="287" text-anchor="end" font-size="12.5" font-weight="700" fill="#12203a">Amazon</text>
  <g filter="url(#lift)">
    <rect x="150" y="256" width="287" height="52" rx="8" fill="#8fb4d0"/>
    <rect x="441" y="256" width="139" height="52" rx="8" fill="#2f6f9f"/>
    <rect x="587" y="256" width="213" height="52" rx="8" fill="#8fb4d0"/>
  </g>
  <text x="293" y="287" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f3852">5 yrs</text>
  <text x="510" y="287" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6 yrs</text>
  <path d="M598,275 L612,275 L605,289 Z" fill="#c2603f"/>
  <text x="708" y="279" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f3852">back to 5 yrs (a subset)</text>
  <text x="708" y="297" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a8492a">−$1.0B net income</text>

  <!-- ── Meta: up, on the same day ── -->
  <text x="138" y="361" text-anchor="end" font-size="12.5" font-weight="700" fill="#12203a">Meta</text>
  <g filter="url(#lift)">
    <rect x="150" y="330" width="430" height="52" rx="8" fill="#8fb4d0"/>
    <rect x="587" y="330" width="213" height="52" rx="8" fill="#4a86b4"/>
  </g>
  <text x="365" y="361" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f3852">5 yrs</text>
  <path d="M598,363 L612,363 L605,349 Z" fill="#ffffff"/>
  <text x="708" y="353" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">up to 5.5 yrs (most)</text>
  <text x="708" y="371" text-anchor="middle" font-size="10.5" font-weight="700" fill="#d5eee6">+$2.59B net income</text>

  <!-- time axis -->
  <line x1="150" y1="398" x2="800" y2="398" stroke="#c8d2e0" stroke-width="1.5"/>
  <g font-size="11" fill="#5a6880" text-anchor="middle">
    <text x="150" y="417">2022</text>
    <text x="294" y="417">2023</text>
    <text x="439" y="417">2024</text>
    <text x="583" y="417">2025</text>
    <text x="728" y="417">2026</text>
  </g>

  <!-- closing note -->
  <g filter="url(#lift)"><rect x="46" y="440" width="788" height="130" rx="14" fill="url(#noteG)" stroke="#dde3ec" stroke-width="1.5"/></g>
  <text x="70" y="470" font-size="13" font-weight="700" fill="#12203a">Same asset class. Same stated cause. Same effective date. Opposite conclusions.</text>
  <text x="70" y="494" font-size="11.5" fill="#5a6880">Amazon blamed "the increased pace of technology development, particularly in the area of artificial intelligence and machine</text>
  <text x="70" y="512" font-size="11.5" fill="#5a6880">learning" for shortening. Microsoft had cited "advances in technology" for lengthening. Amazon's cut covers a subset of servers</text>
  <text x="70" y="530" font-size="11.5" fill="#5a6880">and networking equipment; Meta's extension covers most servers and network assets. Amazon had raised the very same number</text>
  <text x="70" y="548" font-size="11.5" fill="#5a6880">to six years just one year earlier. Neither firm restates the years already booked.</text>
</svg>
