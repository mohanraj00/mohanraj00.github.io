<text x="108" y="361" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#ffffff">Only two people have</text>
<text x="108" y="422" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#ffffff">won both a Turing Award</text>
<text x="108" y="484" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#ffffff">and a Nobel Prize</text>
<text x="110" y="551" font-family="'Source Serif 4', Charter, Georgia, serif" font-size="31" font-style="italic" fill="#d9def0">Two AI researchers, on opposite sides</text>
<text x="110" y="593" font-family="'Source Serif 4', Charter, Georgia, serif" font-size="31" font-style="italic" fill="#d9def0">of the field&#x27;s oldest argument.</text>
