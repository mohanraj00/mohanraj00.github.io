<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Three theories of disruption, tested against the frontier LLM</title>
  <desc id="d">Three rows, each a named theory of disruption tested against the frontier large language model. Row one: Schumpeter's creative destruction, an economy-wide gale remaking many industries at once, marked fits. Row two: Christensen's disruptive innovation, a cheap product entering at the low end or a new market and climbing upmarket, marked does not fit, because the frontier model entered at the expensive high end instead. Row three: marketing's discontinuous innovation, defined by how much behaviour change it demands of the user, marked fits. A closing line reads: same word, three different questions. The frontier LLM answers two of them yes, and the one named after disruptive innovation, no.</desc>

  <defs>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <linearGradient id="paneG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="okChipG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fa"/><stop offset="1" stop-color="#e3edf6"/>
    </linearGradient>
    <linearGradient id="openChipG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1ec"/><stop offset="1" stop-color="#fbe6dd"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#20344f" flood-opacity="0.13"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#93a3b5"/></marker>
  </defs>

  <rect x="10" y="10" width="860" height="600" rx="20" fill="url(#cardG)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#soft)"/>

  <text x="440" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.5">ONE WORD, THREE THEORIES, ONE TEST CASE: THE FRONTIER LLM</text>

  <!-- Row 1 -->
  <g filter="url(#lift)"><rect x="46" y="66" width="300" height="104" rx="14" fill="url(#paneG)" stroke="#dde3ec" stroke-width="1.5"/></g>
  <text x="196" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#12203a">Schumpeter (1942)</text>
  <text x="196" y="122" text-anchor="middle" font-size="12.5" fill="#31405a">Creative destruction:</text>
  <text x="196" y="141" text-anchor="middle" font-size="11.5" fill="#5a6880">an economy-wide gale</text>
  <text x="196" y="157" text-anchor="middle" font-size="11.5" fill="#5a6880">remaking industries at once</text>

  <path d="M 350 118 L 404 118" fill="none" stroke="#93a3b5" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <g filter="url(#lift)"><rect x="414" y="66" width="300" height="104" rx="14" fill="url(#okChipG)" stroke="#cdddec" stroke-width="1.5"/></g>
  <text x="564" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31405a">A frontier-model wave is</text>
  <text x="564" y="124" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31405a">remaking many industries</text>
  <text x="564" y="146" text-anchor="middle" font-size="11.5" fill="#5a6880">at once. Textbook Schumpeter.</text>

  <g><rect x="748" y="94" width="76" height="26" rx="13" fill="#2f6f9f"/><text x="786" y="111.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1">FITS</text></g>

  <!-- Row 2 -->
  <g filter="url(#lift)"><rect x="46" y="196" width="300" height="104" rx="14" fill="url(#paneG)" stroke="#dde3ec" stroke-width="1.5"/></g>
  <text x="196" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#12203a">Christensen (1995/97)</text>
  <text x="196" y="252" text-anchor="middle" font-size="12.5" fill="#31405a">Disruptive innovation:</text>
  <text x="196" y="271" text-anchor="middle" font-size="11.5" fill="#5a6880">enters low-end or new-market,</text>
  <text x="196" y="287" text-anchor="middle" font-size="11.5" fill="#5a6880">then climbs upmarket</text>

  <path d="M 350 248 L 404 248" fill="none" stroke="#93a3b5" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <g filter="url(#lift)"><rect x="414" y="196" width="300" height="104" rx="14" fill="url(#openChipG)" stroke="#c2603f" stroke-width="2"/></g>
  <text x="564" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31405a">Entered at the expensive,</text>
  <text x="564" y="248" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31405a">state-of-the-art high end</text>
  <text x="564" y="270" text-anchor="middle" font-size="11.5" fill="#5a6880">The reverse of a low-end foothold.</text>
  <text x="564" y="286" text-anchor="middle" font-size="11.5" fill="#5a6880">Exactly the loose usage he corrected.</text>

  <g><rect x="722" y="224" width="112" height="26" rx="13" fill="#c2603f"/><text x="778" y="241.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">DOESN'T FIT</text></g>

  <!-- Row 3 -->
  <g filter="url(#lift)"><rect x="46" y="326" width="300" height="104" rx="14" fill="url(#paneG)" stroke="#dde3ec" stroke-width="1.5"/></g>
  <text x="196" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#12203a">Marketing / Rogers</text>
  <text x="196" y="382" text-anchor="middle" font-size="12.5" fill="#31405a">Discontinuous innovation:</text>
  <text x="196" y="401" text-anchor="middle" font-size="11.5" fill="#5a6880">how much the user's behaviour</text>
  <text x="196" y="417" text-anchor="middle" font-size="11.5" fill="#5a6880">has to change to adopt it</text>

  <path d="M 350 378 L 404 378" fill="none" stroke="#93a3b5" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <g filter="url(#lift)"><rect x="414" y="326" width="300" height="104" rx="14" fill="url(#okChipG)" stroke="#cdddec" stroke-width="1.5"/></g>
  <text x="564" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31405a">Demands real behaviour</text>
  <text x="564" y="380" text-anchor="middle" font-size="13.5" font-weight="700" fill="#31405a">change from the user</text>
  <text x="564" y="402" text-anchor="middle" font-size="11.5" fill="#5a6880">Gated by the same adoption</text>
  <text x="564" y="418" text-anchor="middle" font-size="11.5" fill="#5a6880">curve as any category-definer.</text>

  <g><rect x="748" y="354" width="76" height="26" rx="13" fill="#2f6f9f"/><text x="786" y="371.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1">FITS</text></g>

  <!-- Takeaway -->
  <g filter="url(#lift)"><rect x="100" y="470" width="680" height="90" rx="16" fill="url(#openChipG)" stroke="#c2603f" stroke-width="2"/></g>
  <text x="440" y="506" text-anchor="middle" font-size="16" font-weight="700" fill="#12203a">Same word, three different questions.</text>
  <text x="440" y="532" text-anchor="middle" font-size="14" fill="#31405a">The frontier LLM answers two of them yes, and the one the term</text>
  <text x="440" y="551" text-anchor="middle" font-size="14" fill="#31405a">"disruptive innovation" actually names, no.</text>
</svg>
