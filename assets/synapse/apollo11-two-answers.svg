<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The two ages Apollo 11 returned, plotted against the age of the solar system</title>
  <desc id="d">A horizontal scale of billions of years ago, running from 3.5 on the left to 4.8 on the right. Three rows are plotted against it. The first row, the crystalline rocks measured by rubidium-strontium isochron, sits at 3.65 billion years give or take 0.06. The second row, the soil and breccia measured two different ways, sits as a band from 4.6 to 4.66 billion years. The third row, the modern accepted age of the Moon, spans 4.35 to 4.51 billion years. A vertical line at 4.567 billion years marks the age of the solar system, established by lead-lead dating of inclusions in meteorites. The soil band is the only thing on the chart that falls to the right of that line, meaning it reads as older than the solar system itself and therefore cannot be a formation age.</desc>

  <defs>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20344f" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="860" height="450" rx="20" fill="url(#cardG)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#soft)"/>

  <text x="440" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.5">APOLLO 11 CAME BACK WITH TWO ANSWERS, A BILLION YEARS APART</text>
  <text x="440" y="64" text-anchor="middle" font-size="11.5" fill="#5a6880">Ages published in 1970 from the same landing site, plotted on one scale. Older is to the right.</text>

  <!-- the wall: age of the solar system -->
  <rect x="674" y="96" width="14" height="264" rx="4" fill="#c2603f" opacity="0.13"/>
  <line x1="681" y1="96" x2="681" y2="360" stroke="#c2603f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="681" y="88" text-anchor="middle" font-size="10" font-weight="700" fill="#c2603f" letter-spacing="1.2">4.567 · AGE OF THE SOLAR SYSTEM</text>

  <!-- ── Row 1: the crystalline rocks ── -->
  <text x="90" y="130" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.2">THE ROCKS · RUBIDIUM–STRONTIUM ISOCHRON</text>
  <line x1="140" y1="156" x2="206" y2="156" stroke="#2f6f9f" stroke-width="3"/>
  <line x1="140" y1="148" x2="140" y2="164" stroke="#2f6f9f" stroke-width="3"/>
  <line x1="206" y1="148" x2="206" y2="164" stroke="#2f6f9f" stroke-width="3"/>
  <circle cx="173" cy="156" r="8" fill="#2f6f9f" filter="url(#lift)"/>
  <text x="222" y="153" font-size="13" font-weight="700" fill="#12203a">3.65 ± 0.06 billion years</text>
  <text x="222" y="170" font-size="11" fill="#5a6880">Six crystalline rocks. This is the age of the lava plain they landed on.</text>

  <!-- ── Row 2: the soil ── -->
  <text x="90" y="222" font-size="11" font-weight="700" fill="#c2603f" letter-spacing="1.2">THE SOIL · TWO METHODS, TWO LABS, SAME DUST</text>
  <text x="717" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#a8492a">4.6 – 4.66</text>
  <g filter="url(#lift)">
    <rect x="697" y="250" width="40" height="26" rx="7" fill="#c2603f"/>
  </g>
  <text x="668" y="258" text-anchor="end" font-size="11" fill="#5a6880">Fine dust and breccia, dated by uranium–thorium–lead and by</text>
  <text x="668" y="273" text-anchor="end" font-size="11" fill="#5a6880">rubidium–strontium. Both land past the line, so neither can be a formation age.</text>

  <!-- ── Row 3: modern accepted age of the Moon ── -->
  <text x="90" y="322" font-size="11" font-weight="700" fill="#5a6880" letter-spacing="1.2">FOR REFERENCE · THE MOON'S AGE AS UNDERSTOOD TODAY</text>
  <g filter="url(#lift)">
    <rect x="561" y="338" width="89" height="26" rx="7" fill="#8fb4d0"/>
  </g>
  <text x="605" y="356" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12203a">4.35 – 4.51</text>

  <!-- axis -->
  <line x1="90" y1="392" x2="810" y2="392" stroke="#c3ccd9" stroke-width="1.5"/>
  <g font-size="10.5" fill="#5a6880" text-anchor="middle">
    <line x1="145" y1="392" x2="145" y2="398" stroke="#c3ccd9" stroke-width="1.5"/><text x="145" y="412">3.6</text>
    <line x1="256" y1="392" x2="256" y2="398" stroke="#c3ccd9" stroke-width="1.5"/><text x="256" y="412">3.8</text>
    <line x1="367" y1="392" x2="367" y2="398" stroke="#c3ccd9" stroke-width="1.5"/><text x="367" y="412">4.0</text>
    <line x1="478" y1="392" x2="478" y2="398" stroke="#c3ccd9" stroke-width="1.5"/><text x="478" y="412">4.2</text>
    <line x1="589" y1="392" x2="589" y2="398" stroke="#c3ccd9" stroke-width="1.5"/><text x="589" y="412">4.4</text>
    <line x1="699" y1="392" x2="699" y2="398" stroke="#c3ccd9" stroke-width="1.5"/><text x="699" y="412">4.6</text>
    <line x1="810" y1="392" x2="810" y2="398" stroke="#c3ccd9" stroke-width="1.5"/><text x="810" y="412">4.8</text>
  </g>
  <text x="440" y="436" text-anchor="middle" font-size="11" fill="#5a6880">billions of years before present</text>
</svg>
