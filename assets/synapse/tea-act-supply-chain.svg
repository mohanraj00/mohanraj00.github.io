<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="860" height="350" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="tea-title tea-desc">
  <title id="tea-title">How the Tea Act shortened the route from the East India Company to the colonist</title>
  <desc id="tea-desc">Two routes for tea. Before 1773: East India Company, then the London auction, then a colonial merchant, then the colonist; smuggled Dutch tea also reached the colonist as a cheaper side route. Under the Tea Act of 1773: East India Company, then the company's own agent in America, then the colonist. The London auction and the colonial merchant are marked as cut out, and smuggled tea as now undersold. The Townshend tax applies to legal tea on both routes; smuggled tea avoided it.</desc>

  <defs>
    <linearGradient id="tea-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <filter id="tea-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <marker id="tea-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f93a8"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="840" height="330" rx="18" fill="url(#tea-card)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#tea-soft)"/>

  <!-- eyebrows -->
  <g font-size="11" font-weight="700" letter-spacing="1.6" fill="#6a798d">
    <text x="40" y="52">BEFORE 1773</text>
    <text x="40" y="232">UNDER THE TEA ACT, 1773</text>
  </g>

  <!-- lane 1 -->
  <g font-size="13.5" font-weight="600" fill="#12203a" text-anchor="middle">
    <rect x="40" y="66" width="150" height="48" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="115" y="95">East India Company</text>

    <rect x="230" y="66" width="150" height="48" rx="8" fill="#fbf1ec" stroke="#c2603f" stroke-width="1.5"/>
    <text x="305" y="86">London auction</text>
    <text x="305" y="104" font-size="11" font-weight="600" fill="#c2603f">cut out</text>

    <rect x="420" y="66" width="150" height="48" rx="8" fill="#fbf1ec" stroke="#c2603f" stroke-width="1.5"/>
    <text x="495" y="86">Colonial merchant</text>
    <text x="495" y="104" font-size="11" font-weight="600" fill="#c2603f">cut out</text>

    <rect x="420" y="132" width="150" height="48" rx="8" fill="#ffffff" stroke="#c2603f" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="495" y="152">Smuggled Dutch tea</text>
    <text x="495" y="170" font-size="11" font-weight="600" fill="#c2603f">now undersold</text>

    <rect x="660" y="66" width="160" height="114" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="740" y="118">Colonist</text>
    <text x="740" y="138" font-size="11" font-weight="400" fill="#6a798d">Townshend tax on legal tea</text>
  </g>
  <g stroke="#7f93a8" stroke-width="1.75" marker-end="url(#tea-arrow)">
    <line x1="190" y1="90" x2="228" y2="90"/>
    <line x1="380" y1="90" x2="418" y2="90"/>
    <line x1="570" y1="90" x2="658" y2="90"/>
    <line x1="570" y1="156" x2="658" y2="156"/>
  </g>

  <!-- lane 2 -->
  <g font-size="13.5" font-weight="600" fill="#12203a" text-anchor="middle">
    <rect x="40" y="246" width="150" height="48" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="115" y="275">East India Company</text>

    <rect x="230" y="246" width="340" height="48" rx="8" fill="#eaf1f8" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="400" y="275">The company's own agent in America</text>

    <rect x="660" y="246" width="160" height="48" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="740" y="266">Colonist</text>
    <text x="740" y="284" font-size="11" font-weight="400" fill="#6a798d">+ Townshend tax</text>
  </g>
  <g stroke="#7f93a8" stroke-width="1.75" marker-end="url(#tea-arrow)">
    <line x1="190" y1="270" x2="228" y2="270"/>
    <line x1="570" y1="270" x2="658" y2="270"/>
  </g>
</svg>
