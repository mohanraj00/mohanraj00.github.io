<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="team-title team-desc">
  <title id="team-title">How the Tea Act shortened the route from the East India Company to the colonist</title>
  <desc id="team-desc">Two routes for tea, side by side. Before 1773: East India Company, then the London auction, then a colonial merchant, then the colonist; smuggled Dutch tea also reached the colonist as a cheaper side route. Under the Tea Act of 1773: East India Company, then the company's own agent in America, then the colonist. The London auction and the colonial merchant are marked as cut out, and smuggled tea as now undersold. The Townshend tax applies to legal tea on both routes; smuggled tea avoided it.</desc>

  <defs>
    <linearGradient id="team-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <filter id="team-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <marker id="team-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f93a8"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="344" height="424" rx="16" fill="url(#team-card)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#team-soft)"/>

  <g font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#6a798d" text-anchor="middle">
    <text x="95" y="44">BEFORE 1773</text>
    <text x="265" y="44">TEA ACT, 1773</text>
  </g>

  <g font-size="12.5" font-weight="600" fill="#12203a" text-anchor="middle">
    <!-- left column -->
    <rect x="20" y="60" width="150" height="44" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="95" y="87">East India Company</text>

    <rect x="20" y="130" width="150" height="44" rx="8" fill="#fbf1ec" stroke="#c2603f" stroke-width="1.5"/>
    <text x="95" y="149">London auction</text>
    <text x="95" y="165" font-size="10.5" fill="#c2603f">cut out</text>

    <rect x="20" y="200" width="150" height="44" rx="8" fill="#fbf1ec" stroke="#c2603f" stroke-width="1.5"/>
    <text x="95" y="219">Colonial merchant</text>
    <text x="95" y="235" font-size="10.5" fill="#c2603f">cut out</text>

    <rect x="20" y="290" width="150" height="44" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="95" y="309">Colonist</text>
    <text x="95" y="325" font-size="10.5" font-weight="400" fill="#6a798d">tax on legal tea only</text>

    <rect x="20" y="370" width="150" height="44" rx="8" fill="#ffffff" stroke="#c2603f" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="95" y="389">Smuggled Dutch tea</text>
    <text x="95" y="405" font-size="10.5" fill="#c2603f">now undersold</text>

    <!-- right column -->
    <rect x="190" y="60" width="150" height="44" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="265" y="87">East India Company</text>

    <rect x="190" y="130" width="150" height="114" rx="8" fill="#eaf1f8" stroke="#2f6f9f" stroke-width="1.5"/>
    <text x="265" y="183">The company's</text>
    <text x="265" y="199">own agent</text>

    <rect x="190" y="290" width="150" height="44" rx="8" fill="#ffffff" stroke="#c3cdd9" stroke-width="1.25"/>
    <text x="265" y="309">Colonist</text>
    <text x="265" y="325" font-size="10.5" font-weight="400" fill="#6a798d">+ Townshend tax</text>
  </g>

  <g stroke="#7f93a8" stroke-width="1.75" marker-end="url(#team-arrow)">
    <line x1="95" y1="104" x2="95" y2="128"/>
    <line x1="95" y1="174" x2="95" y2="198"/>
    <line x1="95" y1="244" x2="95" y2="288"/>
    <line x1="95" y1="370" x2="95" y2="336"/>
    <line x1="265" y1="104" x2="265" y2="128"/>
    <line x1="265" y1="244" x2="265" y2="288"/>
  </g>
</svg>
