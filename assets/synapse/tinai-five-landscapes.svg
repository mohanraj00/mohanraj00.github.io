<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'Segoe UI', system-ui, -apple-system, 'Noto Sans Tamil', 'Tamil Sangam MN', sans-serif" role="img" aria-labelledby="tnd-t tnd-d">
<title id="tnd-t">The five tinai: each landscape stands for one stage of love</title><desc id="tnd-d">Five cards. Kurinji: hills, lovers meet. Mullai: forest and pasture, patient waiting. Marutam: farmland, sulking. Neytal: seashore, pining. Palai: no land of its own, separation. Kurinji is highlighted with a note: poem 40 is filed under kurinji, and the label alone sets the scene, a hillside at midnight in the cold season, with two lovers who meet in secret.</desc>
<defs><linearGradient id="tnd-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/></linearGradient>
<filter id="tnd-soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1a2740" flood-opacity="0.10"/></filter></defs>
