<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="bench-title bench-desc">
  <title id="bench-title">LangExtract MATCH_EXACT and groundgate on 4,350 real extractions</title>
  <desc id="bench-desc">Three pairs of horizontal bars on a 0 to 100 percent axis, pooled over 14 runs: seven models at two chunk sizes on 30 documents. Wrong extractions accepted without review: MATCH_EXACT 98.3 percent, 115 of 117; groundgate 6.8 percent, 8 of 117. Correct extractions rejected: MATCH_EXACT 4.6 percent, 194 of 4,233; groundgate 0.3 percent, 14 of 4,233. Sent to a person: MATCH_EXACT none; groundgate 12.1 percent, 526 of 4,350.</desc>
  <defs>
    <linearGradient id="bench-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <filter id="bench-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <filter id="bench-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20344f" flood-opacity="0.11"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="860" height="456" rx="20" fill="url(#bench-card)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#bench-soft)"/>
  <text x="36" y="48" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.5">SEVEN MODELS, 30 DOCUMENTS, 4,350 EXTRACTIONS</text>
  <text x="36" y="76" font-size="20" font-weight="700" fill="#12203a">What each gate let through, and what it cost</text>
  <line x1="316.0" y1="120" x2="316.0" y2="376" stroke="#e4e9f1" stroke-width="1"/>
  <text x="316.0" y="112" text-anchor="middle" font-size="10.5" fill="#8a96a8">0%</text>
  <line x1="426.0" y1="120" x2="426.0" y2="376" stroke="#e4e9f1" stroke-width="1"/>
  <text x="426.0" y="112" text-anchor="middle" font-size="10.5" fill="#8a96a8">25%</text>
  <line x1="536.0" y1="120" x2="536.0" y2="376" stroke="#e4e9f1" stroke-width="1"/>
  <text x="536.0" y="112" text-anchor="middle" font-size="10.5" fill="#8a96a8">50%</text>
  <line x1="646.0" y1="120" x2="646.0" y2="376" stroke="#e4e9f1" stroke-width="1"/>
  <text x="646.0" y="112" text-anchor="middle" font-size="10.5" fill="#8a96a8">75%</text>
  <line x1="756.0" y1="120" x2="756.0" y2="376" stroke="#e4e9f1" stroke-width="1"/>
  <text x="756.0" y="112" text-anchor="middle" font-size="10.5" fill="#8a96a8">100%</text>
  <text x="300" y="148" text-anchor="end" font-size="13" font-weight="700" fill="#12203a">Wrong extractions accepted</text>
  <text x="300" y="166" text-anchor="end" font-size="12" fill="#5a6880">without review</text>
  <rect x="316" y="128" width="432.5" height="22" rx="4" fill="#9aa8ba"/>
  <text x="738.5" y="143.5" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff">98.3%  <tspan font-weight="400">115 of 117</tspan></text>
  <rect x="316" y="156" width="29.9" height="22" rx="4" fill="#2f6f9f"/>
  <text x="353.9" y="171.5" font-size="12" font-weight="700" fill="#12203a">6.8%  <tspan font-weight="400" fill="#5a6880">8 of 117</tspan></text>
  <text x="300" y="242" text-anchor="end" font-size="13" font-weight="700" fill="#12203a">Correct extractions rejected</text>
  <rect x="316" y="216" width="20.2" height="22" rx="4" fill="#9aa8ba"/>
  <text x="344.2" y="231.5" font-size="12" font-weight="700" fill="#12203a">4.6%  <tspan font-weight="400" fill="#5a6880">194 of 4,233</tspan></text>
  <rect x="316" y="244" width="3.0" height="22" rx="4" fill="#2f6f9f"/>
  <text x="327.0" y="259.5" font-size="12" font-weight="700" fill="#12203a">0.3%  <tspan font-weight="400" fill="#5a6880">14 of 4,233</tspan></text>
  <text x="300" y="330" text-anchor="end" font-size="13" font-weight="700" fill="#12203a">Sent to a person</text>
  <text x="327.0" y="319.5" font-size="12" font-weight="700" fill="#12203a">0%  <tspan font-weight="400" fill="#5a6880">none</tspan></text>
  <rect x="316" y="332" width="53.2" height="22" rx="4" fill="#2f6f9f"/>
  <text x="377.2" y="347.5" font-size="12" font-weight="700" fill="#12203a">12.1%  <tspan font-weight="400" fill="#5a6880">526 of 4,350</tspan></text>
  <rect x="316" y="396" width="14" height="14" rx="3" fill="#9aa8ba"/>
  <text x="338" y="407.5" font-size="12" fill="#12203a">LangExtract, MATCH_EXACT only</text>
  <rect x="566" y="396" width="14" height="14" rx="3" fill="#2f6f9f"/>
  <text x="588" y="407.5" font-size="12" fill="#12203a">groundgate</text>
  <text x="36" y="442" font-size="11" fill="#5a6880">Pooled over 14 runs, which share documents, so no intervals. Per-run tables: github.com/mohanraj00/groundgate, bench/RESULTS.md</text>
</svg>
