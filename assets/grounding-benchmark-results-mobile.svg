<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 588" width="400" height="588" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="benchm-title benchm-desc">
  <title id="benchm-title">LangExtract MATCH_EXACT and groundgate on 4,350 real extractions</title>
  <desc id="benchm-desc">Three pairs of horizontal bars on a 0 to 100 percent axis, pooled over 14 runs: seven models at two chunk sizes on 30 documents. Wrong extractions accepted without review: MATCH_EXACT 98.3 percent, 115 of 117; groundgate 6.8 percent, 8 of 117. Correct extractions citing the right place, rejected: MATCH_EXACT 4.6 percent, 194 of 4,233; groundgate 0.3 percent, 14 of 4,233. Sent to a person: MATCH_EXACT none; groundgate 12.1 percent, 526 of 4,350.</desc>
  <defs>
    <linearGradient id="benchm-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <filter id="benchm-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/>
    </filter>
    <filter id="benchm-lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20344f" flood-opacity="0.11"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="380" height="568" rx="20" fill="url(#benchm-card)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#benchm-soft)"/>
  <text x="36" y="46" font-size="10" font-weight="700" fill="#2f6f9f" letter-spacing="1.2">7 MODELS, 30 DOCUMENTS, 4,350 EXTRACTIONS</text>
  <text x="36" y="74" font-size="20" font-weight="700" fill="#12203a">What each gate let through,</text>
  <text x="36" y="99" font-size="20" font-weight="700" fill="#12203a">and what it cost</text>
  <rect x="36" y="118" width="14" height="14" rx="3" fill="#9aa8ba"/>
  <text x="58" y="129.5" font-size="13" fill="#12203a">LangExtract, MATCH_EXACT only</text>
  <rect x="36" y="142" width="14" height="14" rx="3" fill="#2f6f9f"/>
  <text x="58" y="153.5" font-size="13" fill="#12203a">groundgate</text>
  <text x="36" y="196" font-size="14" font-weight="700" fill="#12203a">Wrong extractions accepted without review</text>
  <rect x="36" y="208" width="322.4" height="24" rx="4" fill="#9aa8ba"/>
  <text x="348.4" y="224.5" text-anchor="end" font-size="13" font-weight="700" fill="#12203a">98.3%  <tspan font-weight="400">115 of 117</tspan></text>
  <rect x="36" y="238" width="22.3" height="24" rx="4" fill="#2f6f9f"/>
  <text x="66.3" y="254.5" font-size="13" font-weight="700" fill="#12203a">6.8%  <tspan font-weight="400" fill="#5a6880">8 of 117</tspan></text>
  <text x="36" y="300" font-size="14" font-weight="700" fill="#12203a">Correct extractions rejected</text>
  <text x="36" y="318" font-size="13" fill="#5a6880">citing the right place</text>
  <rect x="36" y="328" width="15.1" height="24" rx="4" fill="#9aa8ba"/>
  <text x="59.1" y="344.5" font-size="13" font-weight="700" fill="#12203a">4.6%  <tspan font-weight="400" fill="#5a6880">194 of 4,233</tspan></text>
  <rect x="36" y="358" width="3.0" height="24" rx="4" fill="#2f6f9f"/>
  <text x="47.0" y="374.5" font-size="13" font-weight="700" fill="#12203a">0.3%  <tspan font-weight="400" fill="#5a6880">14 of 4,233</tspan></text>
  <text x="36" y="420" font-size="14" font-weight="700" fill="#12203a">Sent to a person</text>
  <text x="36.0" y="448.5" font-size="13" font-weight="700" fill="#12203a">0%  <tspan font-weight="400" fill="#5a6880">none</tspan></text>
  <rect x="36" y="462" width="39.7" height="24" rx="4" fill="#2f6f9f"/>
  <text x="83.7" y="478.5" font-size="13" font-weight="700" fill="#12203a">12.1%  <tspan font-weight="400" fill="#5a6880">526 of 4,350</tspan></text>
  <text x="36" y="524" font-size="11" fill="#5a6880">Pooled over 14 runs, which share documents,</text>
  <text x="36" y="540" font-size="11" fill="#5a6880">so no intervals. Per-run tables: bench/RESULTS.md</text>
  <text x="36" y="556" font-size="11" fill="#5a6880">in github.com/mohanraj00/groundgate</text>
</svg>
