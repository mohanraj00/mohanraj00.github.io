<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="relay-title relay-desc">
  <title id="relay-title">The model sits out the test and judges the record</title>
  <desc id="relay-desc">The tester types in Claude Code or Codex. In relay mode, the relay, a plugin or project hooks, takes each prompt before the model sees it, so the model does not run. The relay sends the message through the tap to the chat agent, and the reply comes back the same way, byte for byte in both directions. The relay writes a relay record of what the tester saw, and the tap writes a tap record of what the agent received and sent. The audit compares the two records and names the breaks it finds. After the test, the model reads the transcript from the relay record.</desc>
  <defs>
    <linearGradient id="relay-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/></linearGradient>
    <filter id="relay-soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a2740" flood-opacity="0.10"/></filter>
    <filter id="relay-lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#20344f" flood-opacity="0.11"/></filter>
  </defs>
  <rect x="10" y="10" width="860" height="480" rx="20" fill="url(#relay-card)" stroke="#e4e9f1" stroke-width="1.5" filter="url(#relay-soft)"/>
  <text x="36.0" y="48.0" text-anchor="start" font-size="11" font-weight="700" fill="#2f6f9f" letter-spacing="1.5">HOW IT WORKS</text>
  <text x="36.0" y="78.0" text-anchor="start" font-size="22" font-weight="700" fill="#12203a">The model sits out the test. It judges the record.</text>
  <rect x="226" y="112" width="160" height="60" rx="10" fill="#f1f3f6" stroke="#d5deea" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#relay-lift)"/>
  <text x="306.0" y="137.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5a6880">The model</text>
  <text x="306.0" y="156.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">does not run in relay mode</text>
  <rect x="36" y="226" width="130" height="76" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="1.5" filter="url(#relay-lift)"/>
  <text x="101.0" y="249.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Tester</text>
  <text x="101.0" y="268.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">types in Claude Code</text>
  <text x="101.0" y="287.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">or Codex</text>
  <rect x="226" y="226" width="160" height="76" rx="10" fill="#fbeee8" stroke="#c2603f" stroke-width="1.5" filter="url(#relay-lift)"/>
  <text x="306.0" y="249.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Relay</text>
  <text x="306.0" y="268.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">plugin or project hooks,</text>
  <text x="306.0" y="287.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">takes the prompt first</text>
  <rect x="446" y="226" width="150" height="76" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="1.5" filter="url(#relay-lift)"/>
  <text x="521.0" y="249.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Tap</text>
  <text x="521.0" y="268.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">a proxy that records</text>
  <text x="521.0" y="287.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">both directions</text>
  <rect x="656" y="226" width="188" height="76" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="1.5" filter="url(#relay-lift)"/>
  <text x="750.0" y="259.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Your chat agent</text>
  <text x="750.0" y="278.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">unchanged</text>
  <polyline points="166,254 218.0,254.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(226,254) rotate(0.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <polyline points="226,274 174.0,274.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(166,274) rotate(180.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <polyline points="386,254 438.0,254.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(446,254) rotate(0.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <polyline points="446,274 394.0,274.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(386,274) rotate(180.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <polyline points="596,254 648.0,254.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(656,254) rotate(0.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <polyline points="656,274 604.0,274.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(596,274) rotate(180.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <text x="626.0" y="212.0" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6f9f">byte for byte, both ways</text>
  <line x1="306" y1="172" x2="306" y2="226" stroke="#c2603f" stroke-width="1.6" stroke-dasharray="4 4"/>
  <line x1="300" y1="193" x2="312" y2="205" stroke="#c2603f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="300" y1="205" x2="312" y2="193" stroke="#c2603f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="318.0" y="203.0" text-anchor="start" font-size="11" font-weight="400" fill="#c2603f">the prompt never reaches it</text>
  <rect x="226" y="344" width="160" height="52" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="1.5" filter="url(#relay-lift)"/>
  <text x="306.0" y="365.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Relay record</text>
  <text x="306.0" y="384.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">what the tester saw</text>
  <rect x="446" y="344" width="150" height="52" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="1.5" filter="url(#relay-lift)"/>
  <text x="521.0" y="365.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Tap record</text>
  <text x="521.0" y="384.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">what the agent got</text>
  <line x1="306" y1="302" x2="306" y2="344" stroke="#8a9bb0" stroke-width="1.6" stroke-dasharray="3 4"/>
  <line x1="521" y1="302" x2="521" y2="344" stroke="#8a9bb0" stroke-width="1.6" stroke-dasharray="3 4"/>
  <rect x="346" y="424" width="140" height="52" rx="10" fill="#e6eff7" stroke="#2f6f9f" stroke-width="1.5" filter="url(#relay-lift)"/>
  <text x="416.0" y="445.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12203a">Audit</text>
  <text x="416.0" y="464.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5a6880">names the breaks</text>
  <polyline points="306,396 306,450 338.0,450.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(346,450) rotate(0.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <polyline points="521,396 521,450 494.0,450.0" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <g transform="translate(486,450) rotate(180.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <polyline points="226,370 196,370 196,142 218.0,142.0" fill="none" stroke="#2f6f9f" stroke-width="2" stroke-dasharray="6 5"/>
  <g transform="translate(226,142) rotate(0.0)"><path d="M0,0 L-10,-5 L-10,5 z" fill="#2f6f9f"/></g>
  <text x="36.0" y="132.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#2f6f9f">After the test, the</text>
  <text x="36.0" y="150.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#2f6f9f">model reads the transcript</text>
</svg>
