title: Mohan Raj
description: "Solo builder. Engineering writeups on architecture, technology, and how teams (human or agent) are organized to build; plus Midweek Synapse, syntheses from my second-brain wiki."
url: "https://mohanraj00.github.io"
remote_theme: mmistakes/jekyll-theme-basically-basic
google_analytics: G-4C1J6WR3MC

collections:
  tech:
    output: true
    permalink: /tech/:title/
  synapse:
    output: true
    permalink: /synapse/:title/

author: Mohan Raj
# jekyll-seo-tag reads these for the Open Graph / Twitter card and the
# schema.org author block.
social:
  name: Mohan Raj
  links:
    - https://instagram.com/vinavu_ai

defaults:
  - scope:
      type: tech
    values:
      layout: post
      read_time: true
  - scope:
      type: synapse
    values:
      layout: synapse
      read_time: true

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  # Without this the theme skips its head-seo include entirely: no og:image,
  # no twitter:card, no canonical. Every share rendered as a bare link.
  - jekyll-seo-tag

feed:
  collections:
    - tech
    - synapse

# Basically Basic reads nav from _data/navigation.yml; header_pages kept harmlessly for minima fallback
header_pages:
  - tech/index.md
  - synapse/index.md
